[workspace]
members = [
    "hid",
    "rgb",
    "audio",
    "daemon",
    "cli",
    "gui",
    "tests",
]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2021"
authors = ["Aayam Pokhrel <pokhrelaayam1010@gmail.com>", "Ajazz Linux Community"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/AayamPokhrel/AJAZZ_AK820MAX_LINUX_DRIVER"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
cpal = "0.15"
realfft = "3.3"
hidapi = "2.6"
rusb = "0.9"
libc = "0.2"
nix = { version = "0.29", features = ["fs", "ioctl", "poll"] }
parking_lot = "0.12"
