<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Keyboard Body Gradient -->
    <linearGradient id="kbBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Keycap Neon Gradients -->
    <linearGradient id="keyGradCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="keyGradPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <linearGradient id="keyGradPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Equalizer Spectrum Gradient -->
    <linearGradient id="eqGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="40%" stop-color="#A855F7" />
      <stop offset="80%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Radial Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGlow)" stroke-width="6" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="220" r="160" fill="#9333EA" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="160" cy="180" r="120" fill="#00F2FE" opacity="0.10" filter="url(#softGlow)" />

  <!-- Audio Equalizer Bars (10 Bands) Rising in Background -->
  <g filter="url(#glow)" opacity="0.9">
    <!-- Band 1 -->
    <rect x="76" y="160" width="18" height="90" rx="9" fill="url(#eqGrad)" />
    <!-- Band 2 -->
    <rect x="112" y="110" width="18" height="140" rx="9" fill="url(#eqGrad)" />
    <!-- Band 3 -->
    <rect x="148" y="80" width="18" height="170" rx="9" fill="url(#eqGrad)" />
    <!-- Band 4 -->
    <rect x="184" y="125" width="18" height="125" rx="9" fill="url(#eqGrad)" />
    <!-- Band 5 -->
    <rect x="220" y="65" width="18" height="185" rx="9" fill="url(#eqGrad)" />
    <!-- Band 6 -->
    <rect x="256" y="50" width="18" height="200" rx="9" fill="url(#eqGrad)" />
    <!-- Band 7 -->
    <rect x="292" y="85" width="18" height="165" rx="9" fill="url(#eqGrad)" />
    <!-- Band 8 -->
    <rect x="328" y="115" width="18" height="135" rx="9" fill="url(#eqGrad)" />
    <!-- Band 9 -->
    <rect x="364" y="95" width="18" height="155" rx="9" fill="url(#eqGrad)" />
    <!-- Band 10 -->
    <rect x="400" y="145" width="18" height="105" rx="9" fill="url(#eqGrad)" />
  </g>

  <!-- Soundwave Arc Indicators -->
  <path d="M 200 45 A 70 70 0 0 1 312 45" stroke="#00F2FE" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5" filter="url(#glow)" />
  <path d="M 175 30 A 100 100 0 0 1 337 30" stroke="#A855F7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.3" filter="url(#glow)" />

  <!-- Keyboard Chassis (75% Proportional Case) -->
  <rect x="48" y="240" width="416" height="204" rx="24" fill="url(#kbBody)" stroke="#334155" stroke-width="4" />
  <!-- Inner Bezel -->
  <rect x="58" y="248" width="396" height="188" rx="18" fill="#0B101B" stroke="#1E293B" stroke-width="2" />

  <!-- Rotary Volume Knob (Top Right) -->
  <circle cx="426" cy="274" r="16" fill="#1E293B" stroke="#64748B" stroke-width="2.5" />
  <circle cx="426" cy="274" r="11" fill="#0F172A" stroke="#00F2FE" stroke-width="2" filter="url(#glow)" />
  <circle cx="426" cy="266" r="2" fill="#00F2FE" />

  <!-- Physical Keycap Rows (82-Key AK820 Layout Representation) -->
  <g fill="#1E293B" stroke="#334155" stroke-width="1.5">
    <!-- Row 0 (Function Keys) -->
    <rect x="70" y="260" width="22" height="22" rx="4" fill="url(#keyGradCyan)" stroke="#38BDF8" opacity="0.9" />
    <rect x="96" y="260" width="22" height="22" rx="4" />
    <rect x="122" y="260" width="22" height="22" rx="4" />
    <rect x="148" y="260" width="22" height="22" rx="4" />
    <rect x="178" y="260" width="22" height="22" rx="4" />
    <rect x="204" y="260" width="22" height="22" rx="4" />
    <rect x="230" y="260" width="22" height="22" rx="4" />
    <rect x="256" y="260" width="22" height="22" rx="4" />
    <rect x="286" y="260" width="22" height="22" rx="4" />
    <rect x="312" y="260" width="22" height="22" rx="4" />
    <rect x="338" y="260" width="22" height="22" rx="4" />
    <rect x="364" y="260" width="22" height="22" rx="4" />
    <rect x="394" y="260" width="22" height="22" rx="4" fill="url(#keyGradPink)" stroke="#FB7185" />

    <!-- Row 1 (Number Row) -->
    <rect x="70" y="292" width="22" height="22" rx="4" />
    <rect x="96" y="292" width="22" height="22" rx="4" />
    <rect x="122" y="292" width="22" height="22" rx="4" />
    <rect x="148" y="292" width="22" height="22" rx="4" />
    <rect x="174" y="292" width="22" height="22" rx="4" />
    <rect x="200" y="292" width="22" height="22" rx="4" />
    <rect x="226" y="292" width="22" height="22" rx="4" />
    <rect x="252" y="292" width="22" height="22" rx="4" />
    <rect x="278" y="292" width="22" height="22" rx="4" />
    <rect x="304" y="292" width="22" height="22" rx="4" />
    <rect x="330" y="292" width="22" height="22" rx="4" />
    <rect x="356" y="292" width="22" height="22" rx="4" />
    <rect x="382" y="292" width="34" height="22" rx="4" />
    <rect x="420" y="292" width="22" height="22" rx="4" fill="url(#keyGradPurple)" stroke="#C084FC" />

    <!-- Row 2 (QWERTY Row) -->
    <rect x="70" y="324" width="30" height="22" rx="4" />
    <rect x="104" y="324" width="22" height="22" rx="4" />
    <!-- W Key (Illuminated Gaming Cluster) -->
    <rect x="130" y="324" width="22" height="22" rx="4" fill="url(#keyGradCyan)" stroke="#38BDF8" filter="url(#glow)" />
    <rect x="156" y="324" width="22" height="22" rx="4" />
    <rect x="182" y="324" width="22" height="22" rx="4" />
    <rect x="208" y="324" width="22" height="22" rx="4" />
    <rect x="234" y="324" width="22" height="22" rx="4" />
    <rect x="260" y="324" width="22" height="22" rx="4" />
    <rect x="286" y="324" width="22" height="22" rx="4" />
    <rect x="312" y="324" width="22" height="22" rx="4" />
    <rect x="338" y="324" width="22" height="22" rx="4" />
    <rect x="364" y="324" width="22" height="22" rx="4" />
    <rect x="390" y="324" width="26" height="22" rx="4" />
    <rect x="420" y="324" width="22" height="22" rx="4" />

    <!-- Row 3 (ASDF Row) -->
    <rect x="70" y="356" width="34" height="22" rx="4" />
    <!-- A Key -->
    <rect x="108" y="356" width="22" height="22" rx="4" fill="url(#keyGradCyan)" stroke="#38BDF8" filter="url(#glow)" />
    <!-- S Key -->
    <rect x="134" y="356" width="22" height="22" rx="4" fill="url(#keyGradCyan)" stroke="#38BDF8" filter="url(#glow)" />
    <!-- D Key -->
    <rect x="160" y="356" width="22" height="22" rx="4" fill="url(#keyGradCyan)" stroke="#38BDF8" filter="url(#glow)" />
    <rect x="186" y="356" width="22" height="22" rx="4" />
    <rect x="212" y="356" width="22" height="22" rx="4" />
    <rect x="238" y="356" width="22" height="22" rx="4" />
    <rect x="264" y="356" width="22" height="22" rx="4" />
    <rect x="290" y="356" width="22" height="22" rx="4" />
    <rect x="316" y="356" width="22" height="22" rx="4" />
    <rect x="342" y="356" width="22" height="22" rx="4" />
    <rect x="368" y="356" width="48" height="22" rx="4" fill="url(#keyGradPurple)" stroke="#C084FC" />
    <rect x="420" y="356" width="22" height="22" rx="4" />

    <!-- Row 4 (ZXCV & Arrows Row) -->
    <rect x="70" y="388" width="44" height="22" rx="4" />
    <rect x="118" y="388" width="22" height="22" rx="4" />
    <rect x="144" y="388" width="22" height="22" rx="4" />
    <rect x="170" y="388" width="22" height="22" rx="4" />
    <rect x="196" y="388" width="22" height="22" rx="4" />
    <rect x="222" y="388" width="22" height="22" rx="4" />
    <rect x="248" y="388" width="22" height="22" rx="4" />
    <rect x="274" y="388" width="22" height="22" rx="4" />
    <rect x="300" y="388" width="22" height="22" rx="4" />
    <rect x="326" y="388" width="36" height="22" rx="4" />
    <!-- Up Arrow -->
    <rect x="366" y="388" width="22" height="22" rx="4" fill="url(#keyGradPink)" stroke="#FB7185" filter="url(#glow)" />
    <rect x="392" y="388" width="22" height="22" rx="4" />
    <rect x="420" y="388" width="22" height="22" rx="4" />

    <!-- Row 5 (Bottom Spacebar & Arrows) -->
    <rect x="70" y="416" width="26" height="12" rx="3" />
    <rect x="100" y="416" width="26" height="12" rx="3" />
    <rect x="130" y="416" width="26" height="12" rx="3" />
    <!-- Spacebar with Underglow -->
    <rect x="160" y="416" width="130" height="12" rx="3" fill="url(#keyGradCyan)" stroke="#38BDF8" filter="url(#glow)" />
    <rect x="294" y="416" width="26" height="12" rx="3" />
    <rect x="324" y="416" width="22" height="12" rx="3" />
    <!-- Left, Down, Right Arrows -->
    <rect x="350" y="416" width="20" height="12" rx="3" fill="url(#keyGradPink)" stroke="#FB7185" />
    <rect x="374" y="416" width="20" height="12" rx="3" fill="url(#keyGradPink)" stroke="#FB7185" filter="url(#glow)" />
    <rect x="398" y="416" width="20" height="12" rx="3" fill="url(#keyGradPink)" stroke="#FB7185" />
    <rect x="422" y="416" width="20" height="12" rx="3" />
  </g>
</svg>
